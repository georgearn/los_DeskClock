name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleRelease

    - uses: actions/upload-artifact@v7
      with:
        name: DeskClock-release.apk
        path: build/outputs/apk/release/DeskClock-release.apk
        archive: false
