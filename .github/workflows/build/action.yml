name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Decode keystore
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        fi

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleRelease

    - uses: actions/upload-artifact@v7
      with:
        name: DeskClock-release.apk
        path: build/outputs/apk/release/DeskClock-release.apk
        archive: false
