name: magisk module

on:
  workflow_dispatch:
  push:
    paths:
      - 'magisk/**'
      - '.github/workflows/module.yml'

jobs:
  module:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: Checkout DeskClock
      uses: actions/checkout@v6
      with:
        path: deskclock

    - name: Checkout Glimpse
      uses: actions/checkout@v6
      with:
        repository: georgearn/Los_Glimpse
        ref: lineage-23.2
        path: glimpse

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Decode keystore
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        fi

    - name: Build DeskClock
      working-directory: deskclock
      run: ./gradlew assembleRelease

    - name: Build Glimpse
      working-directory: glimpse
      run: ./gradlew assembleRelease

    - name: Build module
      run: |
        deskclock/magisk/build_module.sh \
          deskclock/build/outputs/apk/release/DeskClock-release.apk \
          glimpse/app/build/outputs/apk/release/app-release.apk \
          "$PWD/los-apps-system.zip"

    - uses: actions/upload-artifact@v7
      with:
        name: los-apps-system.zip
        path: los-apps-system.zip
        archive: false
